<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ehoser Update</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="update-body">
    <main class="update-shell">
      <section class="update-card" aria-live="polite">
        <p class="badge">Systemupdate</p>
        <h1>Ehoser wird gerade aktualisiert</h1>
        <p class="lead">
          Wir sind bald wieder online. Der Countdown laeuft bis
          <strong>30.07.2026, 22:00 Uhr</strong>.
        </p>

        <div class="countdown" role="timer" aria-atomic="true">
          <div class="time-box">
            <span id="days" class="time-value">0</span>
            <span class="time-label">Tage</span>
          </div>
          <div class="time-box">
            <span id="hours" class="time-value">00</span>
            <span class="time-label">Stunden</span>
          </div>
          <div class="time-box">
            <span id="minutes" class="time-value">00</span>
            <span class="time-label">Minuten</span>
          </div>
          <div class="time-box">
            <span id="seconds" class="time-value">00</span>
            <span class="time-label">Sekunden</span>
          </div>
        </div>

        <p id="countdownStatus" class="status">Update endet am 30.07.2026 um 22:00 Uhr (Europe/Berlin).</p>
      </section>
    </main>

    <script src="/assets/app.js?v=update-countdown-20260730"></script>
  </body>
</html>
