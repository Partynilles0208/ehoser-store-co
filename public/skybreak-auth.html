<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYBREAK | ehoser Auth</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #061522, #0d3249 58%, #081827);
      color: #f8fcff;
      font-family: Barlow, Arial, sans-serif;
      overflow: hidden;
    }
    .gate {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 18% 18%, #7de5ec33, transparent 34%), linear-gradient(145deg, #071927, #10344b 55%, #081c2b);
      z-index: 2;
    }
    .card {
      width: min(460px, 100%);
      background: #081b2be8;
      border: 1px solid #ffffff24;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 24px 80px #0008;
    }
    .eyebrow {
      color: #d9ff53;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 6px 0 10px;
      font-size: clamp(34px, 8vw, 52px);
    }
    p {
      color: #b9d7e1;
      line-height: 1.55;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      background: #d9ff53;
      color: #102c3f;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .small {
      min-height: 1.5em;
      font-size: 12px;
      color: #89aebc;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: none;
      background: #000;
    }
    body.authed .gate { display: none; }
    body.authed iframe { display: block; }
  </style>
</head>
<body>
  <main class="gate" aria-label="ehoser auth">
    <section class="card">
      <span class="eyebrow">EHOSER AUTH</span>
      <h1>SKYBREAK anmelden</h1>
      <p>Wenn du auf ehoser.de schon angemeldet bist, startet SKYBREAK automatisch. Sonst schickt dich der Button zum normalen ehoser Login und danach direkt wieder hierher.</p>
      <button id="loginBtn" type="button">Mit ehoser anmelden</button>
      <p id="status" class="small">Pruefe ehoser Anmeldung ...</p>
    </section>
  </main>
  <iframe id="gameFrame" title="SKYBREAK" src="about:blank"></iframe>

  <script>
    const authKey = 'skybreakAuthUser';
    const returnTo = '/skybreak-auth.html';
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');
    const frame = document.getElementById('gameFrame');

    function loginUrl() {
      const sameSite = location.hostname === 'ehoser.de' || location.hostname.endsWith('.ehoser.de') || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const base = sameSite ? '/' : 'https://ehoser.de/';
      return base + '?login=1&returnTo=' + encodeURIComponent(returnTo);
    }

    function saveSkybreakUser(user, token) {
      const username = String(user?.username || 'ehoser Spieler').trim().slice(0, 24);
      localStorage.setItem(authKey, JSON.stringify({ username, token, at: Date.now() }));
      localStorage.setItem('ehoserUsername', username);
    }

    async function verify() {
      const token = localStorage.getItem('token');
      if (!token) return null;
      const response = await fetch('/api/verify-token', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!response.ok) throw new Error('not authed');
      const data = await response.json();
      if (data.token) localStorage.setItem('token', data.token);
      saveSkybreakUser(data.user, data.token || token);
      return data.user || {};
    }

    async function start() {
      try {
        const user = await verify();
        document.body.classList.add('authed');
        frame.src = '/skybreak/';
        statusEl.textContent = 'Angemeldet als ' + (user.username || 'ehoser Spieler') + '.';
      } catch {
        localStorage.removeItem(authKey);
        statusEl.textContent = 'Du bist noch nicht mit ehoser angemeldet.';
      }
    }

    loginBtn.addEventListener('click', () => {
      localStorage.setItem('ehoserReturnTo', returnTo);
      window.location.href = loginUrl();
    });

    start();
  </script>
</body>
</html>
