<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYBREAK | ehoser Auth</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #061522, #0d3249 58%, #081827);
      color: #f8fcff;
      font-family: Barlow, Arial, sans-serif;
      overflow: hidden;
    }
    .gate {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 18% 18%, #7de5ec33, transparent 34%), linear-gradient(145deg, #071927, #10344b 55%, #081c2b);
      z-index: 2;
    }
    .card {
      width: min(460px, 100%);
      background: #081b2be8;
      border: 1px solid #ffffff24;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 24px 80px #0008;
    }
    .eyebrow {
      color: #d9ff53;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 6px 0 10px;
      font-size: clamp(34px, 8vw, 52px);
    }
    p {
      color: #b9d7e1;
      line-height: 1.55;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      background: #d9ff53;
      color: #102c3f;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .small {
      min-height: 1.5em;
      font-size: 12px;
      color: #89aebc;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: none;
      background: #000;
    }
    body.authed .gate { display: none; }
    body.authed iframe { display: block; }
  </style>
</head>
<body>
  <main class="gate" aria-label="ehoser auth">
    <section class="card">
      <span class="eyebrow">EHOSER AUTH</span>
      <h1>SKYBREAK anmelden</h1>
      <p>Wenn du auf ehoser.de schon angemeldet bist, startet SKYBREAK automatisch. Sonst schickt dich der Button zum normalen ehoser Login und danach direkt wieder hierher.</p>
      <button id="loginBtn" type="button">Mit ehoser anmelden</button>
      <p id="status" class="small">Pruefe ehoser Anmeldung ...</p>
    </section>
  </main>
  <iframe id="gameFrame" title="SKYBREAK" src="about:blank"></iframe>

  <script>
    const authKey = 'skybreakAuthUser';
    const returnTo = '/skybreak-auth.html';
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');
    const frame = document.getElementById('gameFrame');
    let currentUser = null;
    let refreshTimer = null;

    function loginUrl() {
      const sameSite = location.hostname === 'ehoser.de' || location.hostname.endsWith('.ehoser.de') || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const base = sameSite ? '/' : 'https://ehoser.de/';
      return base + '?login=1&returnTo=' + encodeURIComponent(returnTo);
    }

    function saveSkybreakUser(user, token) {
      const username = String(user?.username || 'ehoser Spieler').trim().slice(0, 24);
      localStorage.setItem(authKey, JSON.stringify({ username, token, at: Date.now() }));
      localStorage.setItem('ehoserUsername', username);
    }

    function headers() {
      return { Authorization: 'Bearer ' + localStorage.getItem('token') };
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function getFriends() {
      try { return new Set(JSON.parse(localStorage.getItem('skybreakFriends') || '[]')); } catch { return new Set(); }
    }

    function setFriends(friends) {
      localStorage.setItem('skybreakFriends', JSON.stringify([...friends]));
    }

    async function fetchSkybreakMembers() {
      const [onlineRes, allRes] = await Promise.allSettled([
        fetch('/api/online-users', { headers: headers() }).then(res => res.ok ? res.json() : { users: [] }),
        fetch('/api/chat/users/search?limit=200', { headers: headers() }).then(res => res.ok ? res.json() : { users: [] })
      ]);
      const onlineUsers = onlineRes.status === 'fulfilled' ? (onlineRes.value.users || []) : [];
      const allUsers = allRes.status === 'fulfilled' ? (allRes.value.users || []) : [];
      const onlineSet = new Set(onlineUsers.filter(u => u.kind !== 'guest').map(u => String(u.username || '').toLowerCase()));
      const names = new Set([
        ...allUsers.map(String),
        ...onlineUsers.filter(u => u.kind !== 'guest').map(u => u.username)
      ].filter(Boolean));

      return [...names]
        .filter(name => name.toLowerCase() !== String(currentUser?.username || '').toLowerCase())
        .sort((a, b) => Number(onlineSet.has(b.toLowerCase())) - Number(onlineSet.has(a.toLowerCase())) || a.localeCompare(b))
        .map(name => ({ username: name, online: onlineSet.has(name.toLowerCase()) }));
    }

    function injectGameStyle(doc) {
      if (doc.getElementById('skybreak-real-multiplayer-style')) return;
      const style = doc.createElement('style');
      style.id = 'skybreak-real-multiplayer-style';
      style.textContent = `
        .skybreak-party-live-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;background:#6b7c85}
        .skybreak-party-live-dot.on{background:#36ff8a;box-shadow:0 0 12px #36ff8a}
        .skybreak-party-row button[disabled]{opacity:.55;cursor:not-allowed}
        .skybreak-party-note strong{color:#d9ff53}
      `;
      doc.head.append(style);
    }

    async function renderRealMembers(doc) {
      const root = doc.getElementById('skybreak-member-list');
      if (!root) return;
      const note = doc.querySelector('.skybreak-party-note');
      if (note) note.innerHTML = '<strong>Supabase live:</strong> echte ehoser Mitglieder. Online-Spieler koennen direkt fuer die Runde markiert werden.';
      let members = [];
      try {
        members = await fetchSkybreakMembers();
      } catch {
        root.innerHTML = '<p class="skybreak-party-note">Konnte ehoser Mitglieder gerade nicht laden.</p>';
        return;
      }

      if (!members.length) {
        root.innerHTML = '<p class="skybreak-party-note">Noch keine anderen ehoser Mitglieder gefunden.</p>';
        return;
      }

      const friends = getFriends();
      root.replaceChildren(...members.map(member => {
        const row = doc.createElement('div');
        row.className = 'skybreak-party-row';
        const copy = doc.createElement('div');
        copy.innerHTML = `<strong><span class="skybreak-party-live-dot ${member.online ? 'on' : ''}"></span>${escapeHtml(member.username)}</strong><small>${member.online ? 'Online · einladbar' : 'ehoser Mitglied · offline'}</small>`;
        const btn = doc.createElement('button');
        btn.type = 'button';
        btn.textContent = friends.has(member.username) ? 'Einladen' : 'Adden';
        btn.disabled = !member.online && friends.has(member.username);
        btn.addEventListener('click', () => {
          const next = getFriends();
          if (!next.has(member.username)) {
            next.add(member.username);
            setFriends(next);
            doc.defaultView.toast?.(member.username + ' zu SKYBREAK hinzugefuegt.', 2);
            renderRealMembers(doc);
            return;
          }
          localStorage.setItem('skybreakPendingInvite', JSON.stringify({ to: member.username, from: currentUser?.username || 'ehoser Spieler', at: Date.now() }));
          doc.defaultView.toast?.(member.username + ' ist fuer deine SKYBREAK-Runde markiert.', 3);
        });
        row.append(copy, btn);
        return row;
      }));
    }

    function disableMatchmakingInGame(doc) {
      const findButton = doc.getElementById('skybreak-find-match');
      if (!findButton) return;
      findButton.disabled = true;
      findButton.textContent = 'Spielersuche aus';
      findButton.title = 'Spielersuche ist aktuell ausgeschaltet.';
    }

    function installGameBridge() {
      const doc = frame.contentDocument;
      if (!doc) return;
      injectGameStyle(doc);
      const tick = () => {
        renderRealMembers(doc);
        disableMatchmakingInGame(doc);
      };
      tick();
      doc.getElementById('skybreak-menu-toggle')?.addEventListener('click', () => setTimeout(() => renderRealMembers(doc), 0));
      clearInterval(refreshTimer);
      refreshTimer = setInterval(() => renderRealMembers(doc), 10000);
    }

    async function verify() {
      const token = localStorage.getItem('token');
      if (!token) return null;
      const response = await fetch('/api/verify-token', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!response.ok) throw new Error('not authed');
      const data = await response.json();
      if (data.token) localStorage.setItem('token', data.token);
      saveSkybreakUser(data.user, data.token || token);
      return data.user || {};
    }

    async function start() {
      try {
        const user = await verify();
        currentUser = user;
        document.body.classList.add('authed');
        frame.src = '/skybreak/';
        statusEl.textContent = 'Angemeldet als ' + (user.username || 'ehoser Spieler') + '.';
      } catch {
        localStorage.removeItem(authKey);
        statusEl.textContent = 'Du bist noch nicht mit ehoser angemeldet.';
      }
    }

    loginBtn.addEventListener('click', () => {
      localStorage.setItem('ehoserReturnTo', returnTo);
      window.location.href = loginUrl();
    });

    frame.addEventListener('load', () => {
      setTimeout(installGameBridge, 300);
      setTimeout(installGameBridge, 1600);
    });

    start();
  </script>
</body>
</html>
