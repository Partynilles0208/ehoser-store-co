<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYBREAK | ehoser Auth</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #061522, #0d3249 58%, #081827);
      color: #f8fcff;
      font-family: Barlow, Arial, sans-serif;
      overflow: hidden;
    }
    .gate {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 18% 18%, #7de5ec33, transparent 34%), linear-gradient(145deg, #071927, #10344b 55%, #081c2b);
      z-index: 2;
    }
    .card {
      width: min(460px, 100%);
      background: #081b2be8;
      border: 1px solid #ffffff24;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 24px 80px #0008;
    }
    .eyebrow {
      color: #d9ff53;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 6px 0 10px;
      font-size: clamp(34px, 8vw, 52px);
    }
    p {
      color: #b9d7e1;
      line-height: 1.55;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      background: #d9ff53;
      color: #102c3f;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .small {
      min-height: 1.5em;
      font-size: 12px;
      color: #89aebc;
    }
    .mp-status {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 3;
      display: none;
      max-width: min(360px, calc(100vw - 28px));
      padding: 10px 12px;
      border: 1px solid #ffffff24;
      border-radius: 8px;
      background: #071927d9;
      color: #d9ff53;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 12px 34px #0007;
    }
    body.authed .mp-status { display: block; }
    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: none;
      background: #000;
    }
    body.authed .gate { display: none; }
    body.authed iframe { display: block; }
  </style>
</head>
<body>
  <main class="gate" aria-label="ehoser auth">
    <section class="card">
      <span class="eyebrow">EHOSER AUTH</span>
      <h1>SKYBREAK anmelden</h1>
      <p>Wenn du auf ehoser.de schon angemeldet bist, startet SKYBREAK automatisch. Sonst schickt dich der Button zum normalen ehoser Login und danach direkt wieder hierher.</p>
      <button id="loginBtn" type="button">Mit ehoser anmelden</button>
      <p id="status" class="small">Pruefe ehoser Anmeldung ...</p>
    </section>
  </main>
  <iframe id="gameFrame" title="SKYBREAK" src="about:blank"></iframe>
  <div id="mpStatus" class="mp-status">Supabase Multiplayer verbindet ...</div>

  <script>
    const authKey = 'skybreakAuthUser';
    const returnTo = '/skybreak-auth.html';
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');
    const frame = document.getElementById('gameFrame');
    const mpStatus = document.getElementById('mpStatus');
    let currentUser = null;
    let skybreakMatch = null;
    let multiplayerInstalled = false;
    let refreshTimer = null;

    function loginUrl() {
      const sameSite = location.hostname === 'ehoser.de' || location.hostname.endsWith('.ehoser.de') || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const base = sameSite ? '/' : 'https://ehoser.de/';
      return base + '?login=1&returnTo=' + encodeURIComponent(returnTo);
    }

    function saveSkybreakUser(user, token) {
      const username = String(user?.username || 'ehoser Spieler').trim().slice(0, 24);
      localStorage.setItem(authKey, JSON.stringify({ username, token, at: Date.now() }));
      localStorage.setItem('ehoserUsername', username);
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + localStorage.getItem('token')
      };
    }

    async function skybreakApi(path, options = {}) {
      const response = await fetch('/api/skybreak' + path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'SKYBREAK Supabase Fehler');
      return data;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    async function getFriends() {
      const data = await skybreakApi('/friends');
      return new Set(data.friends || []);
    }

    async function addFriend(username) {
      const data = await skybreakApi('/friends', {
        method: 'POST',
        body: JSON.stringify({ username })
      });
      return new Set(data.friends || []);
    }

    async function sendInvite(username) {
      if (!skybreakMatch?.id) throw new Error('Noch keine Supabase Lobby');
      return skybreakApi('/invite', {
        method: 'POST',
        body: JSON.stringify({ username, matchId: skybreakMatch.id })
      });
    }

    async function fetchSkybreakMembers() {
      const data = await skybreakApi('/users');
      const users = data.users || [];
      const onlineSet = new Set(users.filter(u => u.online).map(u => String(u.username || '').toLowerCase()));
      const names = new Set(users.map(u => u.username).filter(Boolean));

      return [...names]
        .filter(name => name.toLowerCase() !== String(currentUser?.username || '').toLowerCase())
        .sort((a, b) => Number(onlineSet.has(b.toLowerCase())) - Number(onlineSet.has(a.toLowerCase())) || a.localeCompare(b))
        .map(name => ({ username: name, online: onlineSet.has(name.toLowerCase()) }));
    }

    function injectGameStyle(doc) {
      if (doc.getElementById('skybreak-real-multiplayer-style')) return;
      const style = doc.createElement('style');
      style.id = 'skybreak-real-multiplayer-style';
      style.textContent = `
        .skybreak-party-live-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;background:#6b7c85}
        .skybreak-party-live-dot.on{background:#36ff8a;box-shadow:0 0 12px #36ff8a}
        .skybreak-party-row button[disabled]{opacity:.55;cursor:not-allowed}
        .skybreak-party-note strong{color:#d9ff53}
        .skybreak-mp-pill{display:block;margin-top:8px;color:#d9ff53;font-weight:900}
      `;
      doc.head.append(style);
    }

    async function renderRealMembers(doc) {
      const root = doc.getElementById('skybreak-member-list');
      if (!root) return;
      const note = doc.querySelector('.skybreak-party-note');
      if (note) note.innerHTML = '<strong>Supabase Multiplayer:</strong> echte ehoser Mitglieder, Freunde und Einladungen laufen ueber Supabase.<span class="skybreak-mp-pill">Lobby: ' + escapeHtml(skybreakMatch?.id || 'verbindet') + '</span>';
      let members = [];
      let friends = new Set();
      try {
        [members, friends] = await Promise.all([fetchSkybreakMembers(), getFriends()]);
      } catch {
        root.innerHTML = '<p class="skybreak-party-note">Konnte ehoser Mitglieder gerade nicht laden.</p>';
        return;
      }

      if (!members.length) {
        root.innerHTML = '<p class="skybreak-party-note">Noch keine anderen ehoser Mitglieder gefunden.</p>';
        return;
      }

      root.replaceChildren(...members.map(member => {
        const row = doc.createElement('div');
        row.className = 'skybreak-party-row';
        const copy = doc.createElement('div');
        copy.innerHTML = `<strong><span class="skybreak-party-live-dot ${member.online ? 'on' : ''}"></span>${escapeHtml(member.username)}</strong><small>${member.online ? 'Online · einladbar' : 'ehoser Mitglied · offline'}</small>`;
        const btn = doc.createElement('button');
        btn.type = 'button';
        btn.textContent = friends.has(member.username) ? 'Einladen' : 'Adden';
        btn.disabled = !member.online && friends.has(member.username);
        btn.addEventListener('click', async () => {
          try {
            if (!friends.has(member.username)) {
              await addFriend(member.username);
              doc.defaultView.toast?.(member.username + ' zu SKYBREAK hinzugefuegt.', 2);
              renderRealMembers(doc);
              return;
            }
            await sendInvite(member.username);
            doc.defaultView.toast?.(member.username + ' wurde ueber Supabase eingeladen.', 3);
          } catch (error) {
            doc.defaultView.toast?.(error.message || 'Supabase Einladung fehlgeschlagen.', 3);
          }
        });
        row.append(copy, btn);
        return row;
      }));
    }

    async function joinSupabaseMatch() {
      const data = await skybreakApi('/join', {
        method: 'POST',
        body: JSON.stringify({ teamMode: 'squad', maxPlayers: 8, state: 'lobby' })
      });
      skybreakMatch = data.match;
      mpStatus.textContent = 'Supabase Lobby aktiv · ' + (data.players?.length || 1) + ' Spieler';
      return data;
    }

    function updateMatchmakingButton(doc) {
      const findButton = doc.getElementById('skybreak-find-match');
      if (!findButton) return;
      findButton.disabled = true;
      findButton.textContent = skybreakMatch ? 'Supabase Multiplayer aktiv' : 'Supabase verbindet';
      findButton.title = 'Battle-Royale-Spielersuche ist aus. Multiplayer laeuft ueber Supabase.';
    }

    function createMultiplayerScript() {
      const config = {
        matchId: skybreakMatch?.id || '',
        username: currentUser?.username || 'ehoser Spieler'
      };
      return `(${function skybreakSupabaseMultiplayer(config) {
        const token = localStorage.getItem('token');
        if (!token || !config.matchId) return;
        const peers = new Map();
        const colors = [0x74dadd, 0xd9ff53, 0xb7a1e4, 0xffa764, 0x86cfad, 0xff6f91];

        async function api(path, options = {}) {
          const response = await fetch('/api/skybreak' + path, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token,
              ...(options.headers || {})
            }
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || 'Supabase Multiplayer Fehler');
          return data;
        }

        function status(text) {
          const host = parent?.document?.getElementById('mpStatus');
          if (host) host.textContent = text;
        }

        function localState() {
          try {
            if (typeof player !== 'undefined' && player) {
              return {
                x: Number(player.x) || 0,
                y: Number(player.y) || 0,
                z: Number(player.z) || 0,
                yaw: typeof yaw !== 'undefined' ? Number(yaw) || 0 : 0,
                hp: Number(player.health) || 200,
                state: typeof state !== 'undefined' ? String(state) : 'playing'
              };
            }
          } catch {}
          return { x: 0, y: 0, z: 0, yaw: 0, hp: 200, state: 'lobby' };
        }

        function makeLabel(name) {
          const canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = 'rgba(7,25,39,.82)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#d9ff53';
          ctx.font = '700 24px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(name.slice(0, 18), 128, 32);
          const texture = new THREE.CanvasTexture(canvas);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
          sprite.position.set(0, 2.7, 0);
          sprite.scale.set(4, 1, 1);
          return sprite;
        }

        function createPeer(name, index) {
          let root = null;
          let avatar = null;
          try {
            if (typeof createCharacter === 'function' && typeof matchGroup !== 'undefined') {
              const skin = typeof SKINS !== 'undefined' ? SKINS[(index + 1) % SKINS.length] : null;
              avatar = createCharacter(skin?.color || colors[index % colors.length], skin?.accent || 0xebfbff, (index + 1) % 5);
              root = avatar.root;
              avatar.gun.visible = false;
              matchGroup.add(root);
            }
          } catch {}
          if (!root) {
            root = new THREE.Group();
            root.add(new THREE.Mesh(
              new THREE.BoxGeometry(1, 2, 1),
              new THREE.MeshStandardMaterial({ color: colors[index % colors.length] })
            ));
            scene.add(root);
          }
          root.add(makeLabel(name));
          return { root, avatar, lastSeen: Date.now() };
        }

        function lobbyPoint(name, index) {
          let base = { x: 0, y: 0, z: 0 };
          try {
            if (typeof world !== 'undefined' && world?.stage) {
              base = world.stage.position;
            }
          } catch {}
          const angle = (index / 8) * Math.PI * 2;
          return {
            x: base.x + Math.cos(angle) * 4,
            y: base.y,
            z: base.z + Math.sin(angle) * 4
          };
        }

        function render(players) {
          const others = (players || []).filter(p => p.username && p.username !== config.username);
          const alive = new Set();
          others.forEach((remote, index) => {
            alive.add(remote.username);
            if (!peers.has(remote.username)) peers.set(remote.username, createPeer(remote.username, index));
            const peer = peers.get(remote.username);
            const remoteState = String(remote.state || 'lobby');
            const position = remoteState === 'lobby' ? lobbyPoint(remote.username, index) : remote;
            peer.root.visible = true;
            peer.root.position.set(Number(position.x) || 0, Number(position.y) || 0, Number(position.z) || 0);
            peer.root.rotation.y = Number(remote.yaw) || 0;
            peer.lastSeen = Date.now();
            try {
              if (peer.avatar && typeof animateCharacter === 'function') {
                peer.avatar.action = { dt: .016, simple: false };
                animateCharacter(peer.avatar, performance.now() / 1000 + index, remoteState !== 'lobby', false, false);
                peer.avatar.gun.visible = false;
              }
            } catch {}
          });
          for (const [name, peer] of peers) {
            if (alive.has(name)) continue;
            peer.root.visible = false;
            if (Date.now() - peer.lastSeen > 30000) {
              peer.root.parent?.remove(peer.root);
              peers.delete(name);
            }
          }
          status('Supabase Multiplayer · ' + (others.length + 1) + ' Spieler · Lobby ' + config.matchId.slice(-6));
        }

        async function heartbeat() {
          try {
            const own = localState();
            const data = await api('/heartbeat', {
              method: 'POST',
              body: JSON.stringify({
                matchId: config.matchId,
                teamId: config.username,
                ...own,
                meta: { ehoser: true }
              })
            });
            render(data.players || []);
          } catch (error) {
            status(error.message || 'Supabase Multiplayer offline');
          }
        }

        function markUi() {
          const button = document.getElementById('skybreak-find-match');
          if (button) {
            button.disabled = true;
            button.textContent = 'Supabase Multiplayer aktiv';
            button.title = 'Battle-Royale-Spielersuche ist aus. Multiplayer laeuft ueber Supabase.';
          }
        }

        markUi();
        heartbeat();
        const timer = setInterval(() => {
          markUi();
          heartbeat();
        }, 700);
        addEventListener('pagehide', () => {
          clearInterval(timer);
          fetch('/api/skybreak/leave', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ matchId: config.matchId }),
            keepalive: true
          }).catch(() => {});
        });
      }.toString()})(${JSON.stringify(config)});`;
    }

    function installSupabaseMultiplayer(doc) {
      if (multiplayerInstalled || !skybreakMatch?.id) return;
      multiplayerInstalled = true;
      const script = doc.createElement('script');
      script.textContent = createMultiplayerScript();
      doc.body.append(script);
    }

    function installGameBridge() {
      const doc = frame.contentDocument;
      if (!doc) return;
      injectGameStyle(doc);
      const tick = () => {
        renderRealMembers(doc);
        updateMatchmakingButton(doc);
        installSupabaseMultiplayer(doc);
      };
      tick();
      doc.getElementById('skybreak-menu-toggle')?.addEventListener('click', () => setTimeout(() => renderRealMembers(doc), 0));
      clearInterval(refreshTimer);
      refreshTimer = setInterval(() => renderRealMembers(doc), 10000);
    }

    async function verify() {
      const token = localStorage.getItem('token');
      if (!token) return null;
      const response = await fetch('/api/verify-token', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!response.ok) throw new Error('not authed');
      const data = await response.json();
      if (data.token) localStorage.setItem('token', data.token);
      saveSkybreakUser(data.user, data.token || token);
      return data.user || {};
    }

    async function start() {
      try {
        const user = await verify();
        currentUser = user;
        mpStatus.textContent = 'Supabase Lobby wird erstellt ...';
        await joinSupabaseMatch();
        document.body.classList.add('authed');
        frame.src = '/skybreak/';
        statusEl.textContent = 'Angemeldet als ' + (user.username || 'ehoser Spieler') + '.';
      } catch (error) {
        localStorage.removeItem(authKey);
        statusEl.textContent = error.message || 'Du bist noch nicht mit ehoser angemeldet.';
        mpStatus.textContent = 'Supabase Multiplayer nicht verbunden.';
      }
    }

    loginBtn.addEventListener('click', () => {
      localStorage.setItem('ehoserReturnTo', returnTo);
      window.location.href = loginUrl();
    });

    frame.addEventListener('load', () => {
      setTimeout(installGameBridge, 300);
      setTimeout(installGameBridge, 1600);
    });

    start();
  </script>
</body>
</html>
