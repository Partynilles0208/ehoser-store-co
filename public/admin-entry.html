<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ehoser - Admin Zugang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="container">
        <nav class="navbar">
            <div class="navbar-content">
                <div class="logo" style="cursor:pointer" onclick="window.location.href='/'">
                    <span class="logo-icon">E</span>
                    <h1>ehoser admin</h1>
                </div>
                <div class="nav-links">
                    <a class="nav-link" href="index.html">Startseite</a>
                </div>
            </div>
        </nav>

        <main class="admin-wrapper">
            <section class="admin-card">
                <h2>Admin Zugriff</h2>
                <p class="admin-help">Bitte gib den Admin-Code ein, um den Admin-Bereich zu öffnen.</p>

                <form id="adminEntryForm">
                    <div class="form-group">
                        <label for="adminEntryCode">Admin-Code*</label>
                        <input id="adminEntryCode" name="adminEntryCode" type="password" placeholder="Admin-Code eingeben" required>
                    </div>

                    <div class="admin-actions">
                        <button class="btn-primary" type="submit">Zum Admin-Bereich</button>
                        <button class="btn-secondary" type="button" onclick="window.location.href='index.html?guest=admin'">Als Gast fortfahren</button>
                    </div>
                </form>

                <div id="adminEntryStatus" style="margin-top:18px;"></div>
            </section>
        </main>
    </div>

    <script src="admin-entry.js?v=1"></script>
</body>
</html>
