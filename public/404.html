<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b141a">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden · ehoser</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #eff6f7; background: radial-gradient(circle at 18% 18%, rgba(0, 168, 132, .22), transparent 30rem), radial-gradient(circle at 86% 82%, rgba(0, 132, 255, .14), transparent 28rem), #0b141a; }
    .topbar { height: 72px; padding: 0 clamp(20px, 6vw, 80px); display: flex; align-items: center; justify-content: flex-end; border-bottom: 1px solid rgba(255,255,255,.08); }
    .brand { color: #f5ffff; text-decoration: none; font-size: 1.34rem; letter-spacing: -.045em; font-weight: 800; }
    .brand i { color: #25d366; font-style: normal; }
    main { width: min(720px, calc(100% - 40px)); margin: 0 auto; min-height: calc(100vh - 72px); display: grid; align-content: center; padding: 56px 0 92px; }
    .panel { padding: clamp(30px, 7vw, 64px); background: rgba(17, 27, 33, .82); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; box-shadow: 0 28px 90px rgba(0,0,0,.3); backdrop-filter: blur(14px); }
    .code { margin: 0 0 10px; color: #25d366; font-weight: 800; font-size: .83rem; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 12ch; font-size: clamp(2.15rem, 7vw, 4.25rem); line-height: 1.02; letter-spacing: -.065em; }
    p { max-width: 48ch; margin: 22px 0 0; color: #b8c7ca; line-height: 1.6; font-size: 1.05rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .button { min-height: 46px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 13px; border: 1px solid transparent; font-weight: 750; text-decoration: none; transition: transform .16s ease, background .16s ease; }
    .button:hover { transform: translateY(-2px); }
    .primary { color: #062f23; background: #25d366; }
    .secondary { color: #e7f0f1; border-color: rgba(255,255,255,.15); background: rgba(255,255,255,.045); }
    .hint { margin-top: 31px; color: #779096; font-size: .88rem; }
    @media (max-width: 480px) { .topbar { height: 64px; } main { min-height: calc(100vh - 64px); padding: 26px 0 48px; } .panel { border-radius: 22px; } .actions { display: grid; } .button { width: 100%; } }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/chat/" aria-label="Zum ehoser Chat">eh<i>o</i>ser</a></header>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <p class="code">Fehler 404</p>
      <h1 id="page-title">Seite nicht gefunden.</h1>
      <p>Der eingegebene Link existiert nicht oder wurde verschoben. Du kannst einfach zurück zum Chat oder zum Control Center gehen.</p>
      <div class="actions">
        <a class="button primary" href="/chat/">Zum Chat</a>
        <a class="button secondary" href="/control-center/">Control Center</a>
      </div>
      <p class="hint">ehoser · sicher zurückfinden</p>
    </section>
  </main>
</body>
</html>
