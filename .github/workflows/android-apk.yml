name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/whatsapp-chat-design
    paths:
      - 'android-native/**'
      - 'public/chat/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - 'public/chat/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable chat APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ehoser-chat-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
